name: Android CI & Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 支持在 GitHub 网页端手动一键点击构建

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🛡️ Defensive Check for Gradle Wrapper
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar not found, generating wrapper..."
            gradle wrapper --gradle-version 8.10.2
          fi
          chmod +x gradlew

      - name: ⚡ Set up Gradle & Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 🧪 Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: 📦 Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 🚀 Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PromptFlow-v1.0-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: 📝 Output GitHub Actions Job Summary
        run: |
          echo "### 🎉 Android APK 打包成功！" >> $GITHUB_STEP_SUMMARY
          echo "- **产物名称**: \`PromptFlow-v1.0-Debug-APK\`" >> $GITHUB_STEP_SUMMARY
          echo "- **文件路径**: \`app/build/outputs/apk/debug/app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **下载方式**: 请在当前页面右上角的 **Artifacts** 区域直接点击下载，或用手机扫码/传至手机安装即可。" >> $GITHUB_STEP_SUMMARY
